name: Android Companion Build

on:
  push:
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --project-name ps4_theme_transfer --org com.ljctrlgif --platforms=android .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Theme-Transfer-Android
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
